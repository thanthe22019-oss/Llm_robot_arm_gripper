robot_skill_server:
  ros__parameters:
    planning_group: ur_manipulator
    base_frame: base_link
    end_effector_link: gripper_tcp
    # Initial forward-facing reset pose used by the home skill between tasks.
    home_target: test_configuration
    controller_action: /joint_trajectory_controller/follow_joint_trajectory
    gripper_action: /robotiq_gripper_controller/gripper_cmd
    scene_state_service: /get_scene_state
    # Gazebo world poses are used only to align MoveIt's attached collision
    # body with the physical cube after the fingers close.
    gazebo_pose_topic: /world/empty/dynamic_pose/info
    controller_wait_seconds: 90.0
    perception_wait_seconds: 45.0
    perception_request_timeout: 3.0
    minimum_perception_confidence: 0.70
    postcondition_timeout: 8.0
    gripper_open_position: 0.0
    # A small geometric preload keeps the 40 mm cube between the high-friction
    # pads in Gazebo.  The mechanical limit (0.7929 rad) is deliberately not
    # used because Humble's position controller does not regulate force.
    gripper_closed_position: 0.45
    gripper_max_effort: 40.0
    gripper_command_timeout: 8.0
    gripper_touch_links:
      - robotiq_85_left_knuckle_link
      - robotiq_85_right_knuckle_link
      - robotiq_85_left_finger_link
      - robotiq_85_right_finger_link
      - robotiq_85_left_inner_knuckle_link
      - robotiq_85_right_inner_knuckle_link
      - robotiq_85_left_finger_tip_link
      - robotiq_85_right_finger_tip_link

    # TCP stays on each cube centre. Only arm orientation changes so the
    # aligned cube/zone coordinates remain fixed.
    tool_orientation: [0.0, 1.0, 0.0, 0.0]
    object_orientations:
      red_cube: [0.0, 1.0, 0.0, 0.0]
      yellow_cube: [0.0, 0.98480775, -0.17364818, 0.0]
      blue_cube: [0.0, 0.98480775, 0.17364818, 0.0]
      # A 20-degree tilt keeps the left fingertip above the table at the
      # far negative-Y pick pose without changing the cube coordinates.
      green_cube: [0.0, 0.98480775, 0.17364818, 0.0]
      # Purple starts at the far +X edge. Tilting the tool 40 degrees toward
      # +X moves the wrist centre back inside the UR3e workspace while the TCP
      # still targets the unchanged camera pose of the cube.
      purple_cube: [0.0, 0.93969262, 0.0, 0.34202014]
    object_tool_axis_approach:
      red_cube: false
      yellow_cube: false
      blue_cube: false
      green_cube: false
      purple_cube: true
    # The far-edge purple grasp is tilted. A 22 mm upper-side grasp keeps the
    # lower fingertip clear of the table while both pads still overlap the
    # 40 mm cube. Object and zone poses remain unchanged.
    object_grasp_clearances:
      red_cube: 0.0
      yellow_cube: 0.0
      blue_cube: 0.0
      green_cube: 0.0
      purple_cube: 0.022
    place_orientation: [0.0, 1.0, 0.0, 0.0]
    approach_height: 0.11
    transfer_clearance: 0.05
    object_transfer_clearances:
      red_cube: 0.0
      yellow_cube: 0.05
      blue_cube: 0.05
      green_cube: 0.05
      purple_cube: 0.05
    # Optional Y detours operate only at transfer height. Object and zone
    # coordinates remain unchanged; zero selects the direct route.
    object_transfer_y_offsets:
      red_cube: 0.0
      yellow_cube: 0.0
      blue_cube: 0.0
      green_cube: 0.0
      purple_cube: 0.0
    # gripper_tcp is at the centre between the fingertips.  A zero offset
    # therefore aligns the pads with the centre of a cube.
    grasp_clearance: 0.0
    # Release 10 mm above the table so collision checking does not reject the
    # final attached-cube waypoint; Gazebo gravity performs the short settle.
    place_clearance: 0.01

    planning_time: 10.0
    planning_attempts: 6
    ik_attempts: 16
    # The UR numerical IK plugin may need more than 0.1 s to escape the home
    # singularity and find a collision-free branch.
    ik_timeout: 1.0
    velocity_scaling: 0.05
    acceleration_scaling: 0.05
    cartesian_step: 0.005
    minimum_path_fraction: 0.995
    max_joint_step: 0.35
    # No joint may approach a full revolution in one motion. Wrist joints
    # use a tighter limit because equivalent IK branches often differ by 2*pi.
    max_joint_travel: 5.5
    max_wrist_joint_travel: 5.0
    scene_wait_seconds: 30.0
